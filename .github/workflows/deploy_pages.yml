name: Deploy OpenTerminal to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          cd web
          npm install
          npm run build
          # 确保构建后的文件夹重命名或复制为 out，并存放在正确位置
          # 假设 Next.js 默认导出在 out 目录：
          mkdir -p ../web/out
          # 如果实际在当前目录生成了 out，把它复制到上层或保持原样

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
