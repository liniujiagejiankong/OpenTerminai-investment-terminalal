name: Auto Update AI Anomaly Radar

on:
  schedule:
    - cron: '0 8 * * *' # 每天北京时间下午 4 点（UTC 0点）自动运行一次
  workflow_dispatch: # 允许你在 GitHub 网页上手动随时点击运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run anomaly calculation engine
        run: python scripts/update_anomalies.py

      - name: Commit and push updated anomalies json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git data/anomalies.json || exit 0
          git commit -m "chore: auto-update live data from yfinance and akshare [skip ci]" || exit 0
          git push
